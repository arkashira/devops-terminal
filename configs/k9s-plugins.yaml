# k9s plugins — กดปุ่มลัดจากใน k9s ได้เลย
plugins:
  # เลือก pod แล้วกด Ctrl-L = tail log หลาย pod ด้วย stern
  stern:
    shortCut: Ctrl-L
    description: "logs ทั้งชุด (stern)"
    scopes:
      - pods
    command: stern
    background: false
    args:
      - --tail
      - "50"
      - $FILTER
      - -n
      - $NAMESPACE
      - --context
      - $CONTEXT
  # เลือก pod แล้วกด Ctrl-G = เท log เข้า gonzo (TUI วิเคราะห์ log แบบ realtime)
  gonzo:
    shortCut: Ctrl-G
    description: "logs → gonzo"
    scopes:
      - pods
    command: sh
    background: false
    args:
      - -c
      - "kubectl logs --context $CONTEXT -n $NAMESPACE $NAME --tail=2000 -f | gonzo"
