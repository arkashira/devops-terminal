# starship — Catppuccin Mocha powerline (DevOps edition)
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](red)\
$os\
[](bg:peach fg:red)\
$directory\
[](fg:peach bg:yellow)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$golang\
$nodejs\
$python\
$java\
[](fg:green bg:sapphire)\
$aws\
$terraform\
[](fg:sapphire bg:lavender)\
$kubernetes\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

# มุมขวา: แบต (เมื่อต่ำ) + นาฬิกา จางๆ ไม่รบกวน
right_format = '$battery$time'

palette = 'catppuccin_mocha'

[battery]
full_symbol = '󰁹'
charging_symbol = '󰂄 '
discharging_symbol = '󰂃 '

[[battery.display]]
threshold = 30
style = 'fg:red bold'

[time]
disabled = false
time_format = '%H:%M'
format = '[󰥔 $time](fg:overlay0)'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"
Ubuntu = "󰕈"
Amazon = ""

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

# ภาษาทั้งหมด: เด้งเฉพาะเจอไฟล์ project จริง (go.mod, package.json, ...) ไม่นับไฟล์เศษๆ
[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
detect_extensions = []
detect_files = ['go.mod', 'go.sum', 'go.work']

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
detect_extensions = []
detect_files = ['package.json', '.nvmrc']

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'
detect_extensions = []
detect_files = ['requirements.txt', 'pyproject.toml', 'Pipfile', 'setup.py', 'tox.ini', '.python-version']

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
detect_extensions = []
detect_files = ['pom.xml', 'build.gradle', 'build.gradle.kts', '.java-version']

# โชว์เฉพาะตอน set AWS_PROFILE
[aws]
format = '([ ☁ $profile ](fg:crust bg:sapphire))'

# โชว์เฉพาะใน dir terraform
[terraform]
format = '([ 󱁢 $workspace ](fg:crust bg:sapphire))'

# ⎈ เด้งเฉพาะใน dir/โปรเจกต์ที่มีของ k8s เท่านั้น (ไม่ใช่ทุกที่)
[kubernetes]
disabled = false
format = '[ ⎈ $context( \($namespace\)) ]($style)'
style = 'fg:crust bg:lavender bold'
detect_files = ['kustomization.yaml', 'Chart.yaml', 'values.yaml', 'skaffold.yaml', 'helmfile.yaml', 'application.yaml', 'Tiltfile']
detect_folders = ['k8s', 'kubernetes', 'manifests', 'charts', 'helm', 'gitops', 'argocd', 'apps', 'clusters', 'overlays', 'kustomize', 'templates']
detect_env_vars = ['KUBECONFIG']

# prod = ตัวแดง 🔥 บน segment, uat/stg = เหลือง
[[kubernetes.contexts]]
context_pattern = '.*(prod|prd).*'
style = 'fg:red bg:lavender bold'
symbol = '🔥 '

[[kubernetes.contexts]]
context_pattern = '.*(uat|stg|staging).*'
style = 'fg:maroon bg:lavender bold'

# ย่อ ARN ยาวๆ เหลือชื่อ cluster
[[kubernetes.contexts]]
context_pattern = 'arn:aws:eks:.*:cluster/(?P<cluster>.*)'
context_alias = '$cluster'

[cmd_duration]
min_time = 2000
format = ' 󱦟 $duration '
style = 'fg:subtext0'
show_notifications = false

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
